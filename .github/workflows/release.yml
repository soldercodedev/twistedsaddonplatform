name: Package and release

# Manual release. Run it from the Actions tab (Run workflow), enter a version, and it builds the
# single multi-folder ZIP and uploads it to CurseForge via the CurseForge Upload API.
#
# Repo secret (Settings > Secrets and variables > Actions):
#   CF_API_TOKEN    - CurseForge API token (authors.curseforge.com > API Tokens)
#   CF_PROJECT_ID   - optional; if unset, the id is read from ## X-Curse-Project-ID in TAP/TAP.toc

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish (e.g. 1.0.0-beta)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        id: build
        uses: ./.github/actions/build
        with:
          version: ${{ github.event.inputs.version }}

      - name: Upload to CurseForge
        uses: ./.github/actions/curseforge-upload
        with:
          token:      ${{ secrets.CF_API_TOKEN }}
          project-id: ${{ secrets.CF_PROJECT_ID }}   # optional - falls back to TAP/TAP.toc
          version:    ${{ steps.build.outputs.version }}
          reltype:    ${{ steps.build.outputs.reltype }}
          zip:        ${{ steps.build.outputs.zip }}
          patch:      ${{ steps.build.outputs.patch }}
